# Tests + quick security gates on every PR and push to main; slower or
# drifting scans (new CVEs appear without code changes) weekly.
# Tools come from one pinned nixpkgs revision so CI runs the same binaries as
# the local review (security review 2026-10-03).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIXPKGS: github:NixOS/nixpkgs/b7c2ada94fe99c15b0dbcf4d11fd7850b957a436

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: pytest
        run: nix shell "$NIXPKGS#uv" -c uv run --locked pytest -q --ignore=tests/bench_depths.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: bandit (high severity + high confidence)
        run: nix shell "$NIXPKGS#bandit" -c bandit -r mcp_server scraper agent scripts evals egress_gate -lll -iii -q
      - name: osv-scanner (uv.lock)
        run: nix shell "$NIXPKGS#osv-scanner" -c osv-scanner scan source --lockfile uv.lock
      - name: gitleaks (full history)
        run: nix shell "$NIXPKGS#gitleaks" -c gitleaks git . --redact --no-banner
      - name: shellcheck
        run: nix shell "$NIXPKGS#shellcheck" -c shellcheck -x scripts/run-agent.sh scripts/lib/memguard.sh scripts/diagnose-last-failure.sh
      - name: actionlint
        run: nix shell "$NIXPKGS#actionlint" -c actionlint
      - name: zizmor
        run: nix shell "$NIXPKGS#zizmor" -c zizmor --offline .github/workflows

  weekly-deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: semgrep (OSS registry rules, no login, metrics off)
        run: >-
          nix shell "$NIXPKGS#semgrep" -c semgrep scan --metrics=off --error
          --config p/python --config p/secrets --config p/command-injection
          --severity ERROR
          --exclude-rule python.lang.security.use-defused-xml.use-defused-xml
          .
      - name: trufflehog (full history, no live verification)
        run: nix shell "$NIXPKGS#trufflehog" -c trufflehog git file://. --no-verification --fail --exclude-paths .trufflehog-exclude
