[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.96.0",
    "curl-cffi>=0.7",
    "injection-scanner",
    "markdown-it-py>=4.0.0",
    "mcp>=1.28.1",
    "openai>=2.32.0",
]

[project.scripts]
research-agent-mcp = "mcp_server.server:main"

[tool.uv.sources]
injection-scanner = { git = "https://github.com/jonathanmoregard/injection-scanner", rev = "d44e990770cbf5183ab1d81efea3d510d8155071" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pillow>=10",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "evals"]
