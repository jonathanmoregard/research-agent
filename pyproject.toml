[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.96.0",
    "injection-scanner",
    "mcp>=1.27.0",
    "openai>=2.32.0",
]

[project.scripts]
research-agent-mcp = "mcp_server.server:main"

[tool.uv.sources]
injection-scanner = { git = "https://github.com/jonathanmoregard/injection-scanner", rev = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
