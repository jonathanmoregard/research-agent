# Ephemeral research-agent profile. The outer bubblewrap jail is the hard
# filesystem boundary; Codex adds a read-only tool sandbox and exposes only the
# pre-existing, rate-controlled research MCP shims.
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "disabled"

[features]
apps = false
auth_elicitation = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
computer_use = false
goals = false
guardian_approval = false
hooks = false
image_generation = false
in_app_browser = false
in_app_updates = false
memories = false
multi_agent = false
plugin_sharing = false
plugins = false
remote_plugin = false
shell_snapshot = false
shell_tool = false
skill_mcp_dependency_install = false
skill_search = false
tool_call_mcp_elicitation = false
tool_suggest = false
code_mode_host = false
unified_exec = false
workspace_dependencies = false

# Dual mode (docs/egress-broker.md §12.4): a broker-mode jail carries
# RESEARCH_BROKER_URL/TOKEN and no key (bwrap --clearenv), so the key names
# below pass nothing there; a legacy-mode jail carries the keys and no token.
# The key names are removed with the legacy path in the cleanup PR (§12.1
# PR 4), after which this file names no key (§8.1).
[mcp_servers.exa]
command = "python3"
args = ["/workspace/agent/shims/exa_shim.py"]
env_vars = ["RESEARCH_BROKER_URL", "RESEARCH_BROKER_TOKEN", "EXA_API_KEY"]
enabled_tools = ["web_search_exa"]

[mcp_servers.tavily-remote-mcp]
command = "python3"
args = ["/workspace/agent/shims/tavily_shim.py"]
env_vars = ["RESEARCH_BROKER_URL", "RESEARCH_BROKER_TOKEN", "TAVILY_API_KEY"]
enabled_tools = ["tavily_search"]

[mcp_servers.render]
command = "python3"
args = ["/workspace/agent/shims/render_shim.py"]
env_vars = ["RESEARCH_BROKER_URL", "RESEARCH_BROKER_TOKEN", "RESEARCH_RUN_ID"]
enabled_tools = ["render_page", "intercept_page", "browse_open", "browse_act", "browse_screenshot", "browse_save_screenshot", "browse_close"]

[mcp_servers.trademark]
command = "python3"
args = ["/workspace/agent/shims/trademark_shim.py"]
env_vars = ["RESEARCH_BROKER_URL", "RESEARCH_BROKER_TOKEN", "EUIPO_CLIENT_ID", "EUIPO_CLIENT_SECRET"]
enabled_tools = ["trademark_search"]

[mcp_servers.shopping]
command = "python3"
args = ["/workspace/agent/shims/shopping_shim.py"]
env_vars = ["RESEARCH_BROKER_URL", "RESEARCH_BROKER_TOKEN", "EBAY_CLIENT_ID", "EBAY_CLIENT_SECRET", "TRADERA_APP_ID", "TRADERA_APP_KEY"]
enabled_tools = ["ebay_search", "tradera_search"]

[mcp_servers.bolagsverket]
command = "python3"
args = ["/workspace/agent/shims/bolagsverket_shim.py"]
enabled_tools = ["bolagsverket_search"]

[mcp_servers.prv]
command = "python3"
args = ["/workspace/agent/shims/prv_shim.py"]
env_vars = ["PRV_CACHE_DIR"]
enabled_tools = ["prv_search"]
